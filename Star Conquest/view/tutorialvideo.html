<!DOCTYPE html>

<head>
	<title>Star Conquest CUTSCENE</title>



	<style>

		body {
			background-color: black;
			overflow: hidden;
			background-image: url('/intro.jpg');

		}

		#levelmenu {
			height: 85vh;
      color: beige;
      position: absolute;
      margin: auto;
      border: solid 1px white;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
		}

		#levelmenu h1 {
      font-size: 3em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    #levelmenu h1 img {
      height: 100px;
      margin-right: 20px;
    }

    #levelmenu a {
      font-size: 2em;
      margin-bottom: 10px;
      text-decoration: none;
      color: beige;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      padding: 10px 20px;
      transition: all 0.2s ease-in-out;
    }

    #levelmenu a:hover {
      background-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

		/* Set the animation, color, size and hide the text */
.intro {
    position: absolute;
    top: 30%;
    left: 35%;
    z-index: 1;
    animation: intro 6s ease-out 1s;
    color: rgb(75, 213, 238);
    font-weight: 400;
    font-size: 300%;
    opacity: 0;
	margin: auto;
}

@keyframes intro {
    0% {
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    90% {
        opacity: 1;
    }
    100% {
        opacity: 0;
    }
}

/* Set the animation & hide the logo */
.logo {    
    position: absolute;
    top: 20%;
    left: 45%;
    z-index: 1;
    margin: auto;
    animation: logo 9s ease-out 9s;
    opacity: 0;
}

.logo svg {
    width: inherit;
}

/* Scale the logo down and maintain it centered */
@keyframes logo {
    0% {
        width: 18em;        
        transform: scale(2.75);
        opacity: 1;
    }
    50% {
        opacity: 1;
        width: 18em;      
    }
    100% {
        opacity: 0;
        transform: scale(0.1);
        width: 18em;
    }
}

p {
  color: #FFFF82;
}

/* Set the font, lean the board, position it */
#board {
  font-family: Century Gothic, CenturyGothic, AppleGothic, sans-serif;
  transform: perspective(300px) rotateX(25deg);
  transform-origin: 50% 100%;
  text-align: justify;
  position: absolute;
  margin-left: -9em;
  font-weight: bold;
  overflow: hidden;
  font-size: 350%;
  height: 50em;
  width: 22em;
  bottom: 0;
  left: 40%;
}

#board:after {    
  position: absolute;
  content: ' ';
  bottom: 60%;
  left: 0;
  right: 0;
  top: 0;
}

/* Set the scrolling animation and position it */
#content {
  animation: scroll 100s linear 5s;
  position: absolute;
  top: 100%;
}

#title, #subtitle {
  text-align: center;
}

@keyframes scroll {
    0% {
        top: 100%;
    }
    100% {
        top: -75%;
    }
}

#sipkadole {
  position: absolute;
  right: 1%;
  top: 75%;
}

#sipkadole:hover {
  transform: scale(1.25) perspective(1px);
}

#sipkadole2 {
  position: absolute;
  right: 1%;
  top: 65%;
}

#sipkadole2:hover {
  transform: scale(1.25) perspective(1px);
}

#myVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
}





	</style>
